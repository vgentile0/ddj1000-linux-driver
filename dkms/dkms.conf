# DKMS package for the patched snd-usb-audio with DDJ-1000 support.
#
# The real sources (sound/usb) are not shipped: prepare-sources.sh extracts
# them for the target kernel from Debian's linux-source-X.Y package and
# applies the matching snd-usb-audio-ddj1000-<series>.patch before every build.
#
# Extraction runs inside MAKE (see Makefile), not PRE_BUILD, because DKMS
# runs CLEAN between PRE_BUILD and MAKE.

PACKAGE_NAME="ddj1000-snd-usb-audio"
PACKAGE_VERSION="0.2.0"

MAKE[0]="make KVER=${kernelver} KDIR=${kernel_source_dir}"
CLEAN="make clean"

BUILT_MODULE_NAME[0]="snd-usb-audio"
BUILT_MODULE_LOCATION[0]="src/sound/usb/"
DEST_MODULE_LOCATION[0]="/updates/dkms"

BUILT_MODULE_NAME[1]="snd-usbmidi-lib"
BUILT_MODULE_LOCATION[1]="src/sound/usb/"
DEST_MODULE_LOCATION[1]="/updates/dkms"

AUTOINSTALL="yes"
